# Enrutado: qué especialista atiende cada mensaje.
#
# El router es 100% determinista, así que estos casos corren sin OpenAI y en
# milisegundos. Su caso por defecto es `catalog_search`, de modo que un fallo aquí
# significa que un mensaje acaba buscando productos cuando no debía.

- id: saludo
  text: "Hola buenas tardes"
  expect_intent: greet

- id: cortesia-sin-pedido
  text: "Todo en orden hoy"
  expect_intent: small_talk

- id: emoji-suelto
  text: "👍"
  expect_intent: small_talk

- id: busqueda-libre
  text: "Necesito un desayuno para un cumpleaños de hombre"
  expect_intent: catalog_search

- id: campana-fiestas-patrias
  text: "Son regalos Corporativos por Fiestas Patrias"
  expect_intent: catalog_search

- id: cobertura-distrito
  text: "¿Llegan a Miraflores?"
  expect_intent: coverage

- id: cobertura-zona
  text: "¿Qué zonas cubren el delivery en Lima?"
  expect_intent: coverage

# Regresión (25-07-2026): el cliente dio primero el destino. El router lo mandó
# al catálogo y el bot enumeró desayunos que nadie había pedido. Un destino
# explícito se valida antes de descubrir el regalo.
- id: pedido-para-cercado-de-lima
  text: "deseo hacer un pedido para cercado de lima"
  expect_intent: coverage

# La presencia de un distrito no basta por sí sola si se usa como referencia
# creativa y no como destino de entrega.
- id: miraflores-no-es-destino
  text: "quiero flores inspiradas en Miraflores"
  expect_intent: catalog_search

- id: politica-pago
  text: "¿Cómo pago?"
  expect_intent: policy_faq

- id: rastreo
  text: "¿Dónde está mi pedido?"
  expect_intent: track_order

- id: pide-asesor
  text: "Quiero hablar con un asesor"
  expect_intent: escalate

- id: comprobante
  text: "Ya les pagué, aquí está el comprobante"
  expect_intent: escalate

# Regresión: "quiero el panditas" nombra un producto YA mostrado. Es una compra,
# no una búsqueda nueva. Antes acababa en catalog_search y volvía a buscar.
- id: compra-por-nombre
  text: "quiero el panditas"
  state:
    recent_products:
      - {id_producto: 11, nombre: "Terrario Familia Panditas"}
      - {id_producto: 22, nombre: "Ramo de Girasoles"}
  expect_intent: checkout

# Con productos a la vista, "quiero flores" sigue siendo una búsqueda: no toda
# frase con "quiero" es una compra.
- id: busqueda-aunque-haya-productos
  text: "quiero flores"
  state:
    recent_products:
      - {id_producto: 11, nombre: "Terrario Familia Panditas"}
  expect_intent: catalog_search

- id: cierre-en-curso-manda
  text: "Miraflores"
  state:
    checkout_step: district
  expect_intent: checkout

# Regresión: el FSM se tragaba CUALQUIER mensaje durante el cierre. Preguntar
# "¿puedo pagar contra entrega?" mientras el bot pedía la fecha no obtenía
# respuesta: obtenía el siguiente paso del formulario.
- id: pregunta-de-pago-durante-el-cierre
  text: "¿Puedo pagar contra entrega?"
  state:
    checkout_step: date
  expect_intent: policy_faq

- id: metodos-de-pago-durante-el-cierre
  text: "¿Qué métodos de pago tienen?"
  state:
    checkout_step: schedule
  expect_intent: policy_faq

- id: factura-durante-el-cierre
  text: "¿Hacen factura?"
  state:
    checkout_step: card
  expect_intent: policy_faq

# …pero una respuesta al paso sigue siendo del FSM.
- id: respuesta-al-paso-sigue-en-el-fsm
  text: "el viernes"
  state:
    checkout_step: date
  expect_intent: checkout

# Regresión (25-07-2026): la clienta respondió a la cotización de un asesor
# ("… + delivery 15.00 = 150") preguntando qué venía dentro de la canasta. La
# palabra "delivery" era de la CITA, no suya, y el turno acabó en cobertura, que
# le devolvió el marcador interno. `perceive` ya entrega el texto sin la cita:
# esto es ese texto. No es cobertura; qué es exactamente lo decide el LLM.
- id: pregunta-sobre-el-contenido-citando-una-cotizacion
  text: "En este caso, como voy a pagar la canasta quisiera que los productos vengan dentro de este"
  expect_not_intent: coverage
