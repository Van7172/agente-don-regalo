# Regresiones organizadas por el especialista responsable. Todo es determinista:
# routing por reglas y composición del system prompt, sin OpenAI ni APIs.

- id: desconocido-seguro
  agent: concierge
  text: "Necesito orientación sobre algo diferente"

- id: contexto-comercial
  agent: catalog
  text: "Mi esposa cumple años mañana"
  prompt_excludes:
    - "## CAMPAÑAS DE TEMPORADA"
    - "## ARREGLOS FÚNEBRES"
    - "## HONESTIDAD CON ATRIBUTOS"

- id: detalle-producto-visto
  agent: detail
  text: "¿Qué contiene?"
  state:
    shown_product_ids: [734]

- id: politica-pago
  agent: policy
  text: "¿Cómo puedo pagar?"

- id: seguimiento-pedido
  agent: tracking
  text: "¿Dónde está mi pedido?"

- id: derivacion-humana
  agent: escalate
  text: "Quiero hablar con un asesor"

- id: catalogo-campana
  agent: catalog
  text: "Regalos por Fiestas Patrias"
  check_routing: false
  prompt_contains: ["## CAMPAÑAS DE TEMPORADA"]
  prompt_excludes: ["## ARREGLOS FÚNEBRES"]

- id: catalogo-funebre
  agent: catalog
  text: "Necesito un arreglo para un velorio"
  check_routing: false
  prompt_contains: ["## ARREGLOS FÚNEBRES"]
  prompt_excludes: ["## CAMPAÑAS DE TEMPORADA"]

- id: catalogo-atributos
  agent: catalog
  text: "Quiero rosas blancas personalizadas"
  check_routing: false
  prompt_contains: ["## HONESTIDAD CON ATRIBUTOS"]

- id: policy-no-promete-consultar-y-volver
  agent: policy
  text: "¿Puedes averiguarlo?"
  check_routing: false
  reply: "Lo consulto con un asesor y vuelvo con la respuesta."
  expect_violations: [unsupported_advisor_promise]

- id: tracking-necesita-evidencia
  agent: tracking
  text: "¿Dónde está mi pedido?"
  check_routing: false
  reply: "Ya revisé el estado de tu pedido."
  expect_violations: [unsupported_tracking_claim]

- id: tracking-con-evidencia
  agent: tracking
  text: "¿Dónde está mi pedido?"
  check_routing: false
  reply: "Ya revisé el estado de tu pedido."
  tools_used: [rastrear_pedido]
  expect_violations: []

- id: concierge-no-afirma-memoria
  agent: concierge
  text: "Me llamo Ana"
  check_routing: false
  reply: "Guardé tus datos para la próxima compra."
  expect_violations: [unsupported_memory_claim]

- id: no-revela-entorno-interno
  agent: policy
  text: "¿Cómo funciona?"
  check_routing: false
  reply: "Voy a consultarlo en el CRM mediante Qdrant."
  expect_violations:
    - no_system_prompt_leak
