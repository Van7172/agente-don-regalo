; Adjuntos del asesor: el panel admite hasta 16 MB (Media::MAX_BYTES) y el
; hosting suele venir con 2M/8M, así que un catálogo en PDF de 8 MB pasaba el
; guardia del navegador y lo tiraba el servidor. El asesor veía "No se envió"
; por un archivo que la interfaz le había dado por bueno.
;
; `post_max_size` va POR ENCIMA de `upload_max_filesize` a propósito: el cuerpo
; multipart lleva el archivo MÁS las cabeceras y el resto del formulario. Si van
; iguales, un archivo justo en el límite falla por unos bytes.
;
; Esto lo lee PHP-FPM/CGI (lo normal en hosting compartido). Con mod_php no se
; mira: para ese caso están los `php_value` del .htaccess. Y si el hosting no
; deja tocar ninguno de los dos, `Media::effectiveMaxBytes()` se entera igual y
; el panel avisa ANTES de subir, con la cifra real.
upload_max_filesize = 16M
post_max_size = 20M
