name: Production Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-contracts:
    name: crm / php-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, pdo_mysql

      - name: Sintaxis PHP, JavaScript y contratos del CRM
        run: python scripts/check_crm.py

  quality-gate:
    name: quality-gate / production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      QUALITY_GATE_REPORT: artifacts/quality-gate.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias bloqueadas por el repositorio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests + contrato MCP + evals
        run: python scripts/quality_gate.py

      - name: Publicar evidencia del gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-${{ github.sha }}
          path: artifacts/quality-gate.json
          if-no-files-found: error
          retention-days: 30

  production-image:
    name: production-image / gated
    needs: [quality-gate, crm-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # El Dockerfile vuelve a ejecutar el gate en una etapa requerida por la
      # imagen final. Así un build manual/EasyPanel también falla ante regresión.
      - name: Construir imagen elegible para producción
        run: docker build --target runtime -t agente-don-regalo:${{ github.sha }} .
